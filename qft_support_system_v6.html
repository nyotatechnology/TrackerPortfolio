<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest Forward Tanzania — Technical Support System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/tabler-icons.min.css">
<style>
:root {
  --bg: #0f1117;
  --bg2: #161921;
  --bg3: #1d2130;
  --bg4: #252a3a;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #e8eaf2;
  --text2: #9ba1b5;
  --text3: #636a82;
  --accent: #4f7cff;
  --accent2: #3d63e8;
  --green: #2dd98a;
  --green2: #1a9e61;
  --amber: #f5a623;
  --amber2: #c4821a;
  --red: #ff5263;
  --red2: #c73d4c;
  --purple: #9b7dff;
  --teal: #36d9cc;
  --gold: #FFAE00;
  --navy: #073763;
  --radius: 10px;
  --radius-sm: 6px;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* Layout */
.app { display: grid; grid-template-columns: 230px 1fr; grid-template-rows: 56px 1fr; min-height: 100vh; }
.topbar { grid-column: 1/-1; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 14px; z-index:20; position: sticky; top: 0; }
.sidebar { background: var(--bg2); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.main { overflow-y: auto; padding: 24px; }

/* Brand */
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -0.3px; }
.brand-dot { width: 30px; height: 30px; background: radial-gradient(circle at 30% 30%, var(--gold), #d68f00); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; box-shadow: 0 0 14px rgba(255,174,0,0.3); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.menu-toggle { display: none; background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; width: 34px; height: 34px; align-items: center; justify-content: center; cursor: pointer; color: var(--text2); }

/* Role switcher */
.role-switch { display: flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 3px 4px 3px 12px; font-size: 12px; color: var(--text2); cursor: pointer; }
.role-switch select { background: transparent; border: none; color: var(--text); font-family: var(--font); font-size: 12px; font-weight: 600; outline: none; cursor: pointer; padding: 4px 6px; }
.role-switch select option { background: var(--bg3); }

/* Nav */
.nav-section { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; padding: 12px 10px 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text2); font-size: 13px; transition: all .15s; position: relative; }
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: rgba(79,124,255,0.12); color: var(--accent); }
.nav-item .ti { font-size: 16px; }
.nav-badge { margin-left: auto; background: var(--bg4); font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 20px; color: var(--text2); }
.nav-badge.alert { background: rgba(255,82,99,0.2); color: var(--red); }
.nav-hidden { display: none !important; }

/* Cards */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; display:flex; align-items:center; justify-content:space-between; }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; position: relative; overflow: hidden; }
.stat-card::after { content:''; position:absolute; top:0; left:0; width:3px; height:100%; background: var(--accent); opacity:.6; }
.stat-card.r::after { background: var(--red); }
.stat-card.a::after { background: var(--amber); }
.stat-card.g::after { background: var(--green); }
.stat-card.t::after { background: var(--teal); }
.stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.stat-val { font-size: 28px; font-weight: 600; letter-spacing: -1px; }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
.stat-trend { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 4px; }
.trend-up { background: rgba(45,217,138,0.1); color: var(--green); }
.trend-down { background: rgba(255,82,99,0.1); color: var(--red); }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
.badge-red { background: rgba(255,82,99,0.15); color: var(--red); }
.badge-amber { background: rgba(245,166,35,0.15); color: var(--amber); }
.badge-green { background: rgba(45,217,138,0.15); color: var(--green); }
.badge-blue { background: rgba(79,124,255,0.15); color: var(--accent); }
.badge-purple { background: rgba(155,125,255,0.15); color: var(--purple); }
.badge-gray { background: rgba(255,255,255,0.06); color: var(--text2); }
.badge-gold { background: rgba(255,174,0,0.15); color: var(--gold); }

/* Priority dot */
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot-red { background: var(--red); box-shadow: 0 0 6px var(--red); }
.dot-amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.dot-green { background: var(--green); }
.dot-blue { background: var(--accent); }

/* Form */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1/-1; }
label { font-size: 12px; font-weight: 500; color: var(--text2); }
input, select, textarea { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text); font-family: var(--font); font-size: 13px; outline: none; transition: border .15s; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 80px; }
select option { background: var(--bg3); }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; font-family: var(--font); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent2); }
.btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border2); }
.btn-secondary:hover { background: var(--bg4); }
.btn-danger { background: rgba(255,82,99,0.15); color: var(--red); border: 1px solid rgba(255,82,99,0.3); }
.btn-success { background: rgba(45,217,138,0.15); color: var(--green); border: 1px solid rgba(45,217,138,0.3); }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* Timeline */
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding-bottom: 20px; position: relative; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item:not(:last-child)::before { content:''; position:absolute; left:16px; top:32px; bottom:0; width:1px; background: var(--border); }
.tl-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; z-index:1; }
.tl-content { padding-top: 6px; }
.tl-title { font-weight: 500; font-size: 13px; margin-bottom: 2px; }
.tl-meta { font-size: 11px; color: var(--text3); }
.tl-note { margin-top: 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12px; color: var(--text2); line-height: 1.6; }

/* Section header */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
.section-title { font-size: 18px; font-weight: 600; letter-spacing: -0.4px; }
.section-sub { font-size: 13px; color: var(--text3); margin-top: 2px; }

/* Progress bar */
.progress { height: 6px; background: var(--bg4); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width .4s; }

/* Error ID */
.error-id { font-family: var(--mono); font-size: 12px; color: var(--text3); background: var(--bg4); padding: 2px 6px; border-radius: 4px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: 14px; width: 600px; max-width: 100%; max-height: 90vh; overflow-y: auto; }
.modal.wide { width: 760px; }
.modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-body { padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

/* School card */
.school-card { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all .15s; }
.school-card:hover { border-color: var(--border2); transform: translateY(-1px); }
.school-avatar { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
.school-info { flex: 1; min-width: 0; }
.school-name { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.school-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
.school-status { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* Charts */
.mini-bar { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
.bar-col { background: var(--accent); border-radius: 2px 2px 0 0; min-width: 8px; opacity: .7; transition: opacity .15s; cursor: pointer; }
.bar-col:hover { opacity: 1; }

/* Cols */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

/* Alert banner */
.alert-banner { display: flex; align-items: center; gap: 12px; background: rgba(255,82,99,0.08); border: 1px solid rgba(255,82,99,0.2); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 20px; }
.alert-banner .ti { color: var(--red); font-size: 18px; flex-shrink: 0; }
.alert-banner-text { flex: 1; font-size: 13px; }
.alert-banner-text strong { color: var(--red); }

/* Toast */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 10px; padding: 12px 16px; font-size: 13px; z-index: 200; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); transform: translateY(80px); opacity: 0; transition: all .3s; max-width: 90vw; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast .ti { color: var(--green); font-size: 18px; }

/* Pages */
.page { display: none; }
.page.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform:none;} }

/* Chips */
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); color: var(--text2); cursor: pointer; transition: all .15s; }
.chip:hover, .chip.active { background: rgba(79,124,255,0.15); border-color: rgba(79,124,255,0.4); color: var(--accent); }

/* Week pills */
.week-track { display: flex; gap: 6px; flex-wrap: wrap; }
.week-pill { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; width: 58px; height: 58px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg3); cursor: pointer; transition: all .15s; flex-shrink:0; }
.week-pill:hover { border-color: var(--border2); }
.week-pill.done { background: rgba(45,217,138,0.12); border-color: rgba(45,217,138,0.3); }
.week-pill.due { background: rgba(245,166,35,0.12); border-color: rgba(245,166,35,0.4); }
.week-pill.overdue { background: rgba(255,82,99,0.12); border-color: rgba(255,82,99,0.4); }
.week-pill.active { box-shadow: 0 0 0 2px var(--accent); }
.week-pill .wk-num { font-size: 11px; font-weight: 700; }
.week-pill .wk-ic { font-size: 15px; }

/* Avatar */
.av { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

/* Notification dot */
.notif-dot { width: 8px; height: 8px; background: var(--red); border-radius: 50%; position: absolute; top: 4px; right: 4px; }

.empty { color: var(--text3); text-align: center; padding: 40px 0; font-size: 13px; }
.empty .ti { font-size: 36px; display: block; margin-bottom: 12px; opacity: .5; }

/* Detail header */
.detail-hero { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
.detail-hero .school-avatar { width:56px; height:56px; font-size:20px; border-radius:14px; }

/* Responsive */
@media (max-width: 920px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 56px 1fr; }
  .sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: 230px; transform: translateX(-100%); transition: transform .25s; z-index: 30; }
  .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,0.6); }
  .menu-toggle { display: flex; }
  .two-col, .three-col, .form-grid { grid-template-columns: 1fr; }
  .main { padding: 16px; }
  #page-report > div, #page-followup > div, #page-tracker .detail-grid { grid-template-columns: 1fr !important; }
}
.sidebar-backdrop { display:none; position:fixed; inset:56px 0 0 0; background:rgba(0,0,0,0.5); z-index:25; }
.sidebar-backdrop.show { display:block; }
</style>
</head>
<body>

<div class="app">

<!-- Top Bar -->
<header class="topbar">
  <div class="menu-toggle" onclick="toggleSidebar()"><i class="ti ti-menu-2"></i></div>
  <div class="brand">
    <div class="brand-dot">QF</div>
    <span class="hide-sm">Quest Forward Tanzania</span>
  </div>
  <span style="color:var(--text3);font-size:12px" class="hide-sm">/ Technical Support</span>
  <div class="topbar-right">
    <div class="role-switch" title="Switch role view">
      <i class="ti ti-user-cog" style="font-size:14px"></i>
      <select id="role-select" onchange="changeRole()"></select>
    </div>
    <div style="position:relative">
      <i class="ti ti-bell" style="font-size:20px;color:var(--text2);cursor:pointer" onclick="showPage('followup')"></i>
      <div class="notif-dot" id="notif-dot"></div>
    </div>
  </div>
</header>

<div class="sidebar-backdrop" id="sb-backdrop" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="nav-section">Overview</div>
  <div class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')"><i class="ti ti-layout-dashboard"></i>Dashboard <span class="nav-badge alert" id="nav-crit">0</span></div>
  <div class="nav-item" data-page="report" onclick="showPage('report')"><i class="ti ti-bug"></i>Report Error</div>
  <div class="nav-item" data-page="tracker" onclick="showPage('tracker')"><i class="ti ti-list-check"></i>Error Tracker <span class="nav-badge" id="nav-track">0</span></div>

  <div class="nav-section">Support</div>
  <div class="nav-item" data-page="followup" onclick="showPage('followup')"><i class="ti ti-headset"></i>Follow-Up Center <span class="nav-badge alert" id="nav-fu">0</span></div>
  <div class="nav-item" data-page="weekly" onclick="showPage('weekly')"><i class="ti ti-calendar-week"></i>Weekly Check-Ins</div>
  <div class="nav-item" data-page="schools" onclick="showPage('schools')"><i class="ti ti-school"></i>School Profiles</div>
  <div class="nav-item" data-page="troubleshoot" onclick="showPage('troubleshoot')"><i class="ti ti-tools"></i>Troubleshooting</div>

  <div class="nav-section" data-role="admin">Admin</div>
  <div class="nav-item" data-page="analytics" data-role="admin" onclick="showPage('analytics')"><i class="ti ti-chart-bar"></i>Analytics</div>
  <div class="nav-item" data-page="team" data-role="admin" onclick="showPage('team')"><i class="ti ti-users-group"></i>Sub-Admins</div>

  <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border)">
    <div class="nav-item" onclick="exportData()"><i class="ti ti-download"></i>Export Data</div>
    <div class="nav-item" onclick="confirmReset()"><i class="ti ti-refresh"></i>Reset Demo</div>
  </div>
</nav>

<!-- Main Content -->
<main class="main" id="main"></main>
</div>

<!-- Generic Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <div style="font-weight:600" id="modal-title">Modal</div>
      <i class="ti ti-x" style="cursor:pointer;font-size:18px;color:var(--text2)" onclick="closeModal()"></i>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"><i class="ti ti-check"></i><span id="toast-msg">Action completed</span></div>

<script>
/* ============================================================
   QUEST FORWARD TANZANIA — TECHNICAL SUPPORT SYSTEM
   Refined build: live state, persistence, weekly check-ins,
   per-school profiles, sub-admins, role-based views.
   ============================================================ */

/* ---------- Persistence helpers (window.storage with fallback) ---------- */
const HAS_STORE = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');
const mem = {};
async function dbGet(k){ try { if(HAS_STORE){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; } } catch(e){} return (k in mem)? mem[k] : null; }
async function dbSet(k,v){ mem[k]=v; try { if(HAS_STORE){ await window.storage.set(k, JSON.stringify(v)); } } catch(e){} }

/* ---------- Term config ---------- */
const TERM = { label: 'Term 2 · 2026', weeks: 8 };

/* ---------- Sub-admins / team (seed — live list is S.team, managed by System Admin) ---------- */
const SEED_TEAM = [
  { id:'kn', name:'K. Njoro',     role:'Senior Engineer · Lead',     zone:'Moshi Zone',    color:'var(--accent)', email:'knjoro@questforward.org',  phone:'+255 658 066 983', status:'active' },
  { id:'fa', name:'F. Amani',     role:'Senior Engineer',            zone:'Kilema–Kibosho', color:'var(--green)',  email:'famani@questforward.org',  phone:'+255 754 110 220', status:'onsite' },
  { id:'th', name:'T. Hassan',    role:'Senior Engineer',            zone:'Rombo',         color:'var(--purple)', email:'thassan@questforward.org', phone:'+255 762 330 440', status:'active' },
  { id:'cm', name:'Clinton Mbowe',role:'IT Officer · Platform',      zone:'Remote / HQ',   color:'var(--teal)',   email:'cmbowe@questforward.org',  phone:'+255 715 880 990', status:'remote' },
];
function teamById(id){ return (S.team||[]).find(t=>t.id===id) || null; }
const SA_COLORS = ['var(--accent)','var(--green)','var(--purple)','var(--teal)','var(--amber)','var(--red)','#e879f9','#38bdf8','#fb923c','#a3e635'];
function nextSAColor(){ return SA_COLORS[(S.team||[]).length % SA_COLORS.length]; }
function nextSAId(name){
  let base = name.split(' ').filter(Boolean).map(w=>w[0]).join('').toLowerCase().slice(0,3) || 'sa';
  let id = base, n = 2;
  while ((S.team||[]).some(t=>t.id===id)) { id = base + (n++); }
  return id;
}

/* ---------- Seed schools (each with its own profile + assigned sub-admin) ---------- */
const SEED_SCHOOLS = [

async function loadState(){
  const saved = await dbGet('qft_state_v2');
  if (saved && saved.schools && saved.errors) {
    S = saved;
    // backwards-compat: older saves had no team list
    if (!Array.isArray(S.team) || !S.team.length) { S.team = JSON.parse(JSON.stringify(SEED_TEAM)); await persist(); }
    // backwards-compat: older saves had no guides / manuals
    if (!Array.isArray(S.guides) || !S.guides.length) { S.guides = JSON.parse(JSON.stringify(SEED_GUIDES)); await persist(); }
    if (!Array.isArray(S.manuals)) { S.manuals = []; await persist(); }
    return;
  }
  // initialise fresh
  S.team = JSON.parse(JSON.stringify(SEED_TEAM));
  S.guides = JSON.parse(JSON.stringify(SEED_GUIDES));
  S.manuals = [];
  S.schools = JSON.parse(JSON.stringify(SEED_SCHOOLS));
  S.errors = JSON.parse(JSON.stringify(SEED_ERRORS));
  S.checkins = {};
  // seed some weekly check-ins so the system has history
  S.schools.forEach(sc => {
    S.checkins[sc.id] = {};
    for (let w=1; w<=TERM.weeks; w++){
      if (w < selectedWeek) {
        // past weeks mostly completed
        const done = !(sc.id==='machame' && w===2) && !(sc.id==='mweka' && w===3);
        if (done) S.checkins[sc.id][w] = sampleCheckin(sc.id, w);
      }
    }
  });
  S.followups = [];
  S.comms = [
    { school:'kilema', by:'F. Amani', when:isoAgo(2), text:'Confirmed technician visit. Head teacher notified. Lab closed until repair.' },
    { school:'moshiu', by:'C. Mbowe', when:isoAgo(3), text:'Platform team confirmed remote fix in progress. Expected 2h.' },
    { school:'kibosho',by:'F. Amani', when:isoAgo(20),text:'Ordered replacement USB-C hub. Arrives tomorrow. 12 tablets offline temporarily.' },
  ];
  S.seq = 242;
  await persist();
}

/* ============================================================
   UTILITIES
   ============================================================ */
function $(id){ return document.getElementById(id); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function initials(n){ return n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function ageStr(hours){
  if (hours==null) return '—';
  if (hours < 1) return Math.round(hours*60)+'m';
  if (hours < 24) return Math.round(hours)+'h';
  const d=Math.floor(hours/24), h=Math.round(hours%24);
  return d+'d'+(h?(' '+h+'h'):'');
}
function relTime(iso){
  if(!iso) return '';
  const diff = (Date.now()-new Date(iso).getTime())/36e5;
  if (diff<1) return Math.max(1,Math.round(diff*60))+'m ago';
  if (diff<24) return Math.round(diff)+'h ago';
  return Math.round(diff/24)+'d ago';
}
const PRI = { critical:{label:'Critical', badge:'badge-red', dot:'dot-red'}, high:{label:'High', badge:'badge-amber', dot:'dot-amber'}, medium:{label:'Medium', badge:'badge-blue', dot:'dot-blue'}, low:{label:'Low', badge:'badge-green', dot:'dot-green'} };
const STAT = { open:{label:'Open', badge:'badge-red'}, progress:{label:'In Progress', badge:'badge-amber'}, escalated:{label:'Escalated', badge:'badge-purple'}, resolved:{label:'Resolved', badge:'badge-green'} };
const SLA = { critical:2, high:8, medium:24, low:72 };
function slaState(e){
  if (e.status==='resolved') return 'met';
  return e.hours > SLA[e.priority] ? 'breach' : 'ok';
}
const CAT_META = {
  Connectivity:{ic:'ti-wifi-off', color:'var(--amber)'},
  Hardware:{ic:'ti-device-laptop', color:'var(--red)'},
  Platform:{ic:'ti-apps', color:'var(--accent)'},

  Accounts:{ic:'ti-user-x', color:'var(--teal)'},
  Other:{ic:'ti-dots', color:'var(--text2)'}
};
function schoolColor(id){
  const open = openErrorsForSchool(id);
  const crit = open.some(e=>e.priority==='critical');
  if (crit) return {key:'critical', bg:'rgba(255,82,99,0.2)', tc:'var(--red)', label:'Critical', badge:'badge-red'};
  if (open.length) return {key:'warning', bg:'rgba(245,166,35,0.2)', tc:'var(--amber)', label:'Issues', badge:'badge-amber'};
  return {key:'ok', bg:'rgba(45,217,138,0.12)', tc:'var(--green)', label:'Healthy', badge:'badge-green'};
}

/* ---------- Role scoping ---------- */
function visibleSchools(){
  if (activeRole==='admin') return S.schools;
  if (activeRole==='subadmin') return S.schools.filter(s=>s.admin===activeSubadmin);
  if (activeRole==='school') return S.schools.filter(s=>s.id===activeSchoolScope);
  return S.schools;
}
function visibleErrors(){
  const ids = new Set(visibleSchools().map(s=>s.id));
  return S.errors.filter(e=>ids.has(e.school));
}
function roleLabel(){
  if (activeRole==='admin') return 'System Admin — all schools';
  if (activeRole==='subadmin'){ const t=teamById(activeSubadmin); return (t?t.name:'Sub-Admin')+' — '+visibleSchools().length+' schools'; }

}

const PAGES = ['dashboard','report','tracker','followup','weekly','schools','troubleshoot','analytics','team'];
function showPage(name){
  currentPage = name;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.page===name));
  if (window.innerWidth<=920) closeSidebar();
  render();
  $('main').scrollTop = 0;
}
function render(){
  applyRoleVisibility();
  updateBadges();
  const m = $('main');
  const r = {
    dashboard: renderDashboard, report: renderReport, tracker: renderTracker,
    followup: renderFollowup, weekly: renderWeekly, schools: renderSchools,
    troubleshoot: renderTroubleshoot, analytics: renderAnalytics, team: renderTeam
  }[currentPage] || renderDashboard;
  m.innerHTML = r();
  if (currentPage==='report') initReportForm();
  if (currentPage==='tracker') refreshTrackerTable();
}
function applyRoleVisibility(){
  const adminOnly = activeRole!=='admin';
  document.querySelectorAll('[data-role="admin"]').forEach(el=>el.classList.toggle('nav-hidden', adminOnly));
  // school role hides the team page entirely; redirect if needed
  if (adminOnly && (currentPage==='analytics'||currentPage==='team')) { currentPage='dashboard'; }
}
function updateBadges(){
  const errs = visibleErrors();
  const crit = errs.filter(e=>e.priority==='critical' && e.status!=='resolved').length;
  const openTrack = errs.filter(e=>e.status!=='resolved').length;
  const fu = errs.filter(e=>e.status!=='resolved' && (slaState(e)==='breach' || e.status==='escalated')).length
           + weeklyDueCount();
  setBadge('nav-crit', crit, true);
  setBadge('nav-track', openTrack, false);
  setBadge('nav-fu', fu, true);
  $('notif-dot').style.display = (crit+fu)>0 ? 'block':'none';
}
function setBadge(id, n, alert){
  const el=$(id); if(!el) return;
  el.textContent=n; el.style.display = n>0 ? 'inline-block':'none';
  el.classList.toggle('alert', !!alert && n>0);
}
function weeklyDueCount(){
  let n=0;
  visibleSchools().forEach(s=>{ if(!(S.checkins[s.id] && S.checkins[s.id][selectedWeek])) n++; });
  return n;
}

function renderResolutionTimeline(errs){
  const res = errs.filter(e=>e.status==='resolved').sort((a,b)=>a.hours-b.hours).slice(0,4);

  return `<div class="timeline">${res.map(e=>{ const sc=schoolById(e.school); const t=teamById(e.assigned);
    return `<div class="tl-item">
      <div class="tl-icon" style="background:rgba(45,217,138,0.15)"><i class="ti ti-check" style="color:var(--green);font-size:14px"></i></div>

}

function updateSubcategory(){

function renderTracker(){

  return `
  <div class="section-header">

    </div>
  </div>
  <div class="chip-group" style="margin-bottom:16px">

  </div>
  <div class="card" style="padding:0"><div class="table-wrap"><table>

function setTrackerFilter(f){ trackerFilter=f; render(); }
function refreshTrackerTable(){
  const tbody=$('error-tbody'); if(!tbody) return;
  const q=trackerSearch.toLowerCase();
  let list = visibleErrors().filter(e=>{
    const ms = trackerFilter==='all' || e.status===trackerFilter;
    const sc=schoolById(e.school);
    const mq = !q || e.title.toLowerCase().includes(q) || sc.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q);
    return ms && mq;
  });
  if(!list.length){ tbody.innerHTML=`<tr><td colspan="8"><div class="empty"><i class="ti ti-search-off"></i>No matching errors</div></td></tr>`; return; }
  tbody.innerHTML = list.map(e=>{ const sc=schoolById(e.school); const t=teamById(e.assigned); const breach=slaState(e)==='breach';
    return `<tr style="cursor:pointer" onclick="openErrorModal('${e.id}')">
      <td><span class="error-id">${e.id}</span></td>
      <td><span style="font-weight:500;font-size:13px">${esc(e.title)}</span><br><span style="font-size:11px;color:var(--text3)">${esc(sc.name)}</span></td>
      <td><span style="font-size:12px;color:var(--text2)"><i class="ti ${CAT_META[e.cat].ic}" style="color:${CAT_META[e.cat].color};font-size:13px;vertical-align:-2px;margin-right:4px"></i>${e.cat}</span></td>
      <td><span class="badge ${PRI[e.priority].badge}">${PRI[e.priority].label}</span></td>
      <td><span class="badge ${STAT[e.status].badge}">${STAT[e.status].label}</span></td>
      <td style="font-size:12px;color:var(--text2)">${t?esc(t.name):'<span style="color:var(--text3)">Unassigned</span>'}</td>
      <td style="font-size:12px;color:${breach?'var(--red)':'var(--text3)'}">${ageStr(e.hours)}${breach?' <i class="ti ti-alert-triangle" style="font-size:11px"></i>':''}</td>
      <td onclick="event.stopPropagation()"><div style="display:flex;gap:4px">
        <button class="btn btn-secondary btn-sm" style="padding:3px 8px" onclick="openUpdateModal('${e.id}')" title="Add update"><i class="ti ti-message" style="font-size:12px"></i></button>

  }).join('');
}

async function escalate(id){ const e=S.errors.find(x=>x.id===id); if(e){ e.status='escalated'; await persist(); render(); showToast(id+' escalated to platform/vendor team'); } }

/* ============================================================
   WEEKLY CHECK-INS  (per school, per week of term)
   ============================================================ */
function checkinState(schoolId, w){
  const c = S.checkins[schoolId] && S.checkins[schoolId][w];
  if (c) return c.status==='red'?'overdue':c.status==='amber'?'due':'done'; // done/due/overdue maps to colour
  if (w < selectedWeek) return 'overdue';   // past, not done
  if (w === selectedWeek) return 'due';      // current week pending
  return 'future';
}
function renderWeekly(){
  const schools = visibleSchools();
  const weeks = Array.from({length:TERM.weeks},(_,i)=>i+1);
  const totalDue = schools.filter(s=>!(S.checkins[s.id]&&S.checkins[s.id][selectedWeek])).length;
  const doneThis = schools.length - totalDue;
  const pct = Math.round(doneThis/Math.max(1,schools.length)*100);

  return `
  <div class="section-header">
    <div><div class="section-title">Weekly Check-Ins</div><div class="section-sub">${TERM.label} · structured weekly support visit per school</div></div>
    <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2)">
      <span>Viewing week</span>
      <select style="width:auto" onchange="selectedWeek=+this.value;render()">
        ${weeks.map(w=>`<option value="${w}" ${w===selectedWeek?'selected':''}>Week ${w}${w===currentWeek()?' (current)':''}</option>`).join('')}
      </select>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card g"><div class="stat-label">Week ${selectedWeek} Completed</div><div class="stat-val" style="color:var(--green)">${doneThis}<span style="font-size:16px;color:var(--text3)">/${schools.length}</span></div><div class="stat-sub">${pct}% of schools</div></div>
    <div class="stat-card a"><div class="stat-label">Still Due</div><div class="stat-val" style="color:var(--amber)">${totalDue}</div><div class="stat-sub">check-ins outstanding</div></div>
    <div class="stat-card"><div class="stat-label">Term Progress</div><div class="stat-val">${selectedWeek}<span style="font-size:16px;color:var(--text3)">/${TERM.weeks}</span></div><div class="stat-sub">weeks elapsed</div></div>
  </div>

  <div class="card" style="margin-bottom:20px">
    <div class="card-title">Term Completion Grid <span style="font-size:11px;color:var(--text3);text-transform:none;letter-spacing:0">tap a cell to record / view</span></div>

/* --- Manual (file) library helpers --- */
function manualIcon(type, name){
  const n=(name||'').toLowerCase();
  if (type==='application/pdf'||n.endsWith('.pdf')) return {icon:'ti-file-type-pdf', color:'var(--red)',   bg:'rgba(255,82,99,0.12)'};
  if (n.endsWith('.doc')||n.endsWith('.docx'))      return {icon:'ti-file-type-doc', color:'var(--accent)',bg:'rgba(79,124,255,0.12)'};
  if (n.endsWith('.ppt')||n.endsWith('.pptx'))      return {icon:'ti-presentation',  color:'var(--amber)', bg:'rgba(255,176,32,0.12)'};
  if (n.endsWith('.xls')||n.endsWith('.xlsx'))      return {icon:'ti-table',         color:'var(--green)', bg:'rgba(61,220,151,0.12)'};
  if ((type||'').startsWith('image/'))              return {icon:'ti-photo',         color:'var(--purple)',bg:'rgba(167,139,250,0.12)'};
  if (n.endsWith('.html'))                          return {icon:'ti-world',         color:'var(--teal)',  bg:'rgba(45,212,191,0.12)'};
  return {icon:'ti-file-text', color:'var(--text2)', bg:'var(--bg3)'};
}
function fmtSize(b){ if(b==null) return '—'; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

const MANUAL_MAX_BYTES = 2.5*1024*1024; // keep within storage value limits after base64 inflation
function triggerManualUpload(){
  if (activeRole!=='admin'){ showToast('Only the System Admin can upload manuals'); return; }
  $('manual-file').click();
}
function handleManualUpload(input){
  const f=input.files && input.files[0]; input.value=''; if(!f) return;
  if (f.size > MANUAL_MAX_BYTES){ showToast('File too large — maximum '+fmtSize(MANUAL_MAX_BYTES)+'. Compress the PDF or split it.'); return; }
  const reader=new FileReader();
  reader.onload=()=>{
    pendingManual={ name:f.name, type:f.type||'application/octet-stream', size:f.size, data:reader.result };
    openModal('Upload Manual — Details',
      `<div style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:10px;background:var(--bg3);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text2)">
          <i class="ti ti-paperclip" style="color:var(--accent)"></i> ${esc(f.name)} · ${fmtSize(f.size)}</div>
        <div class="form-group"><label>Display Title *</label><input id="mn-title" type="text" value="${esc(f.name.replace(/\.[^.]+$/,''))}"></div>
        <div class="form-group"><label>Category</label><select id="mn-cat">
          ${['General','Connectivity','Hardware','Platform','Power','Accounts','LRS / Router','Tablet Setup'].map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="form-group"><label>Uploaded By</label><input id="mn-by" type="text" value="System Admin"></div>
      </div>`,
      `<button class="btn btn-secondary" onclick="pendingManual=null;closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="saveManual()"><i class="ti ti-upload"></i> Save to Library</button>`);
  };
  reader.onerror=()=>showToast('Could not read the file — please try again');
  reader.readAsDataURL(f);
}
let pendingManual=null;
async function saveManual(){
  if(!pendingManual) return;
  const title=$('mn-title').value.trim(); if(!title){ showToast('Please enter a display title'); return; }
  S.manuals.unshift({ id:'mn'+Date.now(), title, cat:$('mn-cat').value, by:$('mn-by').value.trim()||'System Admin',
    when:new Date().toISOString(), name:pendingManual.name, type:pendingManual.type, size:pendingManual.size, data:pendingManual.data });
  pendingManual=null;
  await persist(); closeModal(); render();
  showToast('Manual uploaded to the library — visible to all roles');
}
function downloadManual(id){
  const m=S.manuals.find(x=>x.id===id); if(!m) return;
  const a=document.createElement('a'); a.href=m.data; a.download=m.name; document.body.appendChild(a); a.click(); a.remove();
  showToast('Downloading '+m.name);
}
function confirmDeleteManual(id){
  const m=S.manuals.find(x=>x.id===id); if(!m) return;
  openModal('Delete Manual',
    `<div style="font-size:13px;color:var(--text2);line-height:1.6">Remove <b style="color:var(--text)">${esc(m.title||m.name)}</b> from the library? Schools and sub-admins will no longer see it.</div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-danger" onclick="deleteManual('${id}')"><i class="ti ti-trash"></i> Delete</button>`);
}
async function deleteManual(id){
  S.manuals=S.manuals.filter(x=>x.id!==id);
  await persist(); closeModal(); render(); showToast('Manual deleted');
}

        <textarea id="g-steps" style="min-height:180px" placeholder="Check the router power light is ON.&#10;Restart the router: unplug for 30 seconds…">${g?esc(g.steps.join('\n')):''}</textarea></div>
      <div style="font-size:11px;color:var(--text3)"><i class="ti ti-info-circle"></i> The guide will appear for all roles (sub-admins and schools) immediately after saving.</div>
    </div>`;
  openModal(g?`Edit Guide — ${g.title}`:'Add Troubleshooting Guide', body,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveGuide(${idx!=null?idx:-1})"><i class="ti ti-check"></i> ${g?'Save Changes':'Add Guide'}</button>`, true);

async function saveGuide(idx){
  const title=$('g-title').value.trim();
  const steps=$('g-steps').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!title){ showToast('Please enter a guide title'); return; }
  if(!steps.length){ showToast('Please enter at least one step'); return; }
  if(idx>=0 && S.guides[idx]){
    Object.assign(S.guides[idx], { title, cat:$('g-cat').value, icon:$('g-icon').value, steps });
    tsSelected=idx;
  } else {
    S.guides.push({ icon:$('g-icon').value, title, cat:$('g-cat').value, steps, custom:true });
    tsSelected=S.guides.length-1;
  }
  await persist(); closeModal(); render();
  showToast(`Guide "${title}" ${idx>=0?'updated':'added'} — ${steps.length} steps`);
}
function confirmDeleteGuide(idx){
  const g=S.guides[idx]; if(!g) return;
  openModal('Delete Guide',
    `<div style="font-size:13px;color:var(--text2);line-height:1.6">Delete the guide <b style="color:var(--text)">${esc(g.title)}</b>? This removes it for all sub-admins and schools.</div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-danger" onclick="deleteGuide(${idx})"><i class="ti ti-trash"></i> Delete</button>`);
}
async function deleteGuide(idx){
  const g=S.guides[idx]; if(!g) return;
  S.guides.splice(idx,1); if(tsSelected===idx) tsSelected=null; else if(tsSelected>idx) tsSelected--;
  await persist(); closeModal(); render(); showToast(`Guide "${g.title}" deleted`);
}

/* ============================================================
   ANALYTICS (admin)
   ============================================================ */
function renderAnalytics(){
  const errs=visibleErrors();
  const resolved=errs.filter(e=>e.status==='resolved');
  const total=errs.length;
  const bySchool={}; errs.forEach(e=>bySchool[e.school]=(bySchool[e.school]||0)+1);
  const ranked=Object.keys(bySchool).map(id=>({id,n:bySchool[id]})).sort((a,b)=>b.n-a.n);
  const maxN=Math.max(1,...ranked.map(r=>r.n));
  const byCat={}; errs.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+1);
  const slaMet = resolved.length ? Math.round(resolved.filter(e=>slaState(e)==='met').length/resolved.length*100) : 0;
  const checkinTotal = visibleSchools().length*selectedWeek;
  let checkinDone=0; visibleSchools().forEach(s=>{ Object.keys(S.checkins[s.id]||{}).forEach(w=>{ if(+w<=selectedWeek) checkinDone++; }); });
  const checkinRate=Math.round(checkinDone/Math.max(1,checkinTotal)*100);

  return `
  <div class="section-header"><div><div class="section-title">Analytics</div><div class="section-sub">${TERM.label} — performance metrics</div></div></div>
  <div class="three-col" style="margin-bottom:20px">
    <div class="stat-card"><div class="stat-label">Total Errors Logged</div><div class="stat-val" style="color:var(--accent)">${total}</div><div class="stat-sub">${resolved.length} resolved</div></div>
    <div class="stat-card g"><div class="stat-label">SLA Compliance</div><div class="stat-val" style="color:var(--green)">${slaMet}<span style="font-size:18px">%</span></div><div class="stat-sub">resolved within target</div></div>
    <div class="stat-card t"><div class="stat-label">Weekly Check-In Rate</div><div class="stat-val" style="color:var(--teal)">${checkinRate}<span style="font-size:18px">%</span></div><div class="stat-sub">${checkinDone}/${checkinTotal} expected</div></div>
  </div>
  <div class="two-col" style="align-items:start">
    <div class="card"><div class="card-title">Errors by School</div>
      <div style="display:flex;flex-direction:column;gap:8px;font-size:12px">
        ${ranked.map(r=>{ const sc=schoolById(r.id); const pct=Math.round(r.n/maxN*100); const col=r.n>=8?'var(--red)':r.n>=5?'var(--amber)':'var(--accent)';
          return `<div style="display:flex;align-items:center;gap:10px"><span style="width:120px;color:var(--text2);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sc.name)}</span><div class="progress" style="flex:1"><div class="progress-fill" style="width:${pct}%;background:${col}"></div></div><span style="color:var(--text2);width:24px;text-align:right">${r.n}</span></div>`; }).join('')}
      </div></div>
    <div class="card"><div class="card-title">Error Type Distribution</div>
      <div style="display:flex;flex-direction:column;gap:10px;font-size:12px">
        ${Object.keys(CAT_META).filter(c=>byCat[c]).sort((a,b)=>byCat[b]-byCat[a]).map(c=>{ const n=byCat[c]; const pct=Math.round(n/Math.max(1,total)*100); const m=CAT_META[c];
          return `<div style="display:flex;justify-content:space-between;align-items:center"><span><i class="ti ${m.ic}" style="color:${m.color};margin-right:6px;font-size:13px"></i>${c}</span><div style="display:flex;align-items:center;gap:8px"><div class="progress" style="width:120px"><div class="progress-fill" style="width:${pct}%;background:${m.color}"></div></div><span style="color:var(--text2);width:54px;text-align:right">${n} (${pct}%)</span></div></div>`; }).join('')}
      </div></div>
  </div>`;
}

      </div>
    </div>`;
  openModal(t?`Edit Sub-Admin — ${t.name}`:'Add Sub-Admin', body,

async function saveSubadmin(id){
  const name=$('sa-name').value.trim();
  if(!name){ showToast('Please enter the sub-admin\'s name'); return; }
  let t = id ? teamById(id) : null;
  if(!t){
    t = { id: nextSAId(name), color: nextSAColor() };
    S.team.push(t);
  }
  t.name=name;
  t.role=$('sa-role').value.trim()||'Field Engineer';
  t.zone=$('sa-zone').value.trim()||'—';
  t.email=$('sa-email').value.trim();
  t.phone=$('sa-phone').value.trim();
  t.status=$('sa-status').value;
  // apply school assignments
  const ticked = new Set(Array.from(document.querySelectorAll('.sa-school:checked')).map(cb=>cb.value));
  S.schools.forEach(s=>{
    if (ticked.has(s.id)) s.admin = t.id;                 // assign / transfer to this sub-admin
    else if (s.admin === t.id) s.admin = '';              // un-ticked: release this school
  });
  await persist(); closeModal(); buildRoleOptions(); render();
  showToast(`${t.name} ${id?'updated':'added'} — managing ${[...ticked].length} school(s)`);
}

/* --- Remove sub-admin --- */
function confirmRemoveSubadmin(id){
  if (activeRole!=='admin'){ showToast('Only the System Admin can manage sub-admins'); return; }
  const t=teamById(id); if(!t) return;
  const mySchools=S.schools.filter(s=>s.admin===id);
  const others=S.team.filter(x=>x.id!==id);
  openModal('Remove Sub-Admin',
    `<div style="font-size:13px;color:var(--text2);line-height:1.7">
      Remove <b style="color:var(--text)">${esc(t.name)}</b> from the team?
      ${mySchools.length?`<br><br>They currently manage <b>${mySchools.length} school(s)</b>: ${mySchools.map(s=>esc(s.name)).join(', ')}.<br>Choose who takes over these schools:`:'<br><br>They have no schools assigned.'}
     </div>
     ${mySchools.length?`<div class="form-group" style="margin-top:12px"><label>Reassign their schools to</label>
       <select id="sa-takeover"><option value="">— Leave unassigned —</option>${others.map(o=>`<option value="${o.id}">${esc(o.name)} — ${esc(o.role)}</option>`).join('')}</select></div>`:''}`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-danger" onclick="removeSubadmin('${id}')"><i class="ti ti-trash"></i> Remove</button>`);
}
async function removeSubadmin(id){
  const t=teamById(id); if(!t) return;
  const takeover = $('sa-takeover') ? $('sa-takeover').value : '';
  S.schools.forEach(s=>{ if(s.admin===id) s.admin=takeover; });
  S.errors.forEach(e=>{ if(e.assigned===id) e.assigned=takeover; });
  S.team = S.team.filter(x=>x.id!==id);
  if (activeSubadmin===id) activeSubadmin = S.team[0] ? S.team[0].id : '';
  await persist(); closeModal(); buildRoleOptions(); render();
  showToast(`${t.name} removed${takeover?` — schools transferred to ${teamById(takeover).name}`:''}`);
}

     <div class="form-group"><label>Sub-Admin</label><select id="as-admin">${S.team.map(t=>`<option value="${t.id}" ${t.id===s.admin?'selected':''}>${esc(t.name)} — ${esc(t.role)}</option>`).join('')}</select></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveAssign('${schoolId}')"><i class="ti ti-check"></i> Save</button>`);
}
async function saveAssign(schoolId){
  const s=schoolById(schoolId); s.admin=$('as-admin').value;
  await persist(); closeModal(); render();
  showToast(`${s.name} reassigned to ${teamById(s.admin).name}`);
}

/* --- Resolve --- */
async function markResolved(id){
  const e=S.errors.find(x=>x.id===id); if(!e) return;
  e.status='resolved'; await persist(); render();
  showToast(`${id} marked resolved`);
}

/* ============================================================
   EXPORT / RESET
   ============================================================ */
function exportData(){
  const rows=[['ID','Title','School','Category','Priority','Status','Assigned','AgeHours','Created','Description']];
  S.errors.forEach(e=>{ const sc=schoolById(e.school);
    rows.push([e.id,e.title,sc.name,e.cat,e.priority,e.status,teamById(e.assigned)?.name||'',e.hours,e.created||'',(e.desc||'').replace(/\n/g,' ')]); });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='qft_errors_export.csv'; a.click(); URL.revokeObjectURL(url);
  showToast('Error log exported as CSV');
}
function confirmReset(){
  openModal('Reset Demo Data',
    `<div style="font-size:13px;color:var(--text2);line-height:1.6">This clears all saved data and restores the original demo schools, errors and check-ins. This cannot be undone.</div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-danger" onclick="doReset()"><i class="ti ti-refresh"></i> Reset Everything</button>`);
}
async function doReset(){
  await dbSet('qft_state_v2', null);
  S={ schools:[], team:[], errors:[], checkins:{}, followups:[], comms:[], guides:[], manuals:[], seq:242 };
  await loadState(); closeModal(); buildRoleOptions(); showPage('dashboard');
  showToast('Demo data reset');
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  await loadState();
  buildRoleOptions();
  $('role-select').value='admin::';
  showPage('dashboard');
})();

</script>
</body>
